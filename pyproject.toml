[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-sentence"
version = "0.1.0"
description = "Real-time sign language recognition with MediaPipe, OpenCV and a Conv1D/BiLSTM sequence model"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["sign-language", "mediapipe", "opencv", "computer-vision", "lstm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "numpy>=1.24",
    "tensorflow>=2.16",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

# Command-line entry points (after `pip install -e .`)
[project.scripts]
sign-collect = "collect_data:main"
sign-train = "train:main"
sign-run = "realtime:main"

[tool.setuptools]
# The project uses flat top-level modules, not a package directory.
py-modules = ["config", "utils", "collect_data", "train", "realtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
